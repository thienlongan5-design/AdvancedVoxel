<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Advanced Voxel</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
            touch-action: none;
        }

        #game {
            position: fixed;
            inset: 0;
            overflow: hidden;
        }

        canvas {
            display: block;
        }

        #crosshair {
            position: fixed;
            left: 50%;
            top: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 20;
        }

        #crosshair::before,
        #crosshair::after {
            content: "";
            position: absolute;
            background: rgba(255,255,255,.8);
        }

        #crosshair::before {
            width: 10px;
            height: 2px;
            top: 4px;
            left: 0;
        }

        #crosshair::after {
            width: 2px;
            height: 10px;
            left: 4px;
            top: 0;
        }

        #hud {
            position: fixed;
            left: 12px;
            top: 10px;
            color: white;
            z-index: 30;
            text-shadow: 1px 1px 2px #000;
            pointer-events: none;
        }

        #health {
            font-size: 17px;
        }

        #oxygen {
            margin-top: 4px;
            font-size: 15px;
        }

        #preview {
            position: fixed;
            right: 10px;
            top: 10px;
            width: 110px;
            height: 110px;
            border: 2px solid rgba(255,255,255,.45);
            background: rgba(0,0,0,.28);
            border-radius: 8px;
            z-index: 25;
            pointer-events: none;
        }

        #hotbar {
            position: fixed;
            left: 50%;
            bottom: 12px;
            transform: translateX(-50%);
            display: flex;
            gap: 4px;
            padding: 5px;
            background: rgba(15,18,22,.8);
            border: 1px solid rgba(255,255,255,.25);
            border-radius: 8px;
            z-index: 30;
        }

        .slot {
            width: 46px;
            height: 46px;
            border: 2px solid rgba(255,255,255,.25);
            background: rgba(30,35,40,.9);
            position: relative;
        }

        .slot.selected {
            border-color: white;
            box-shadow: 0 0 5px white;
        }

        .slot canvas {
            width: 32px;
            height: 32px;
            position: absolute;
            left: 5px;
            top: 4px;
            image-rendering: pixelated;
        }

        .count {
            position: absolute;
            right: 2px;
            bottom: 0;
            color: white;
            font-size: 12px;
            text-shadow: 1px 1px #000;
        }

        #craftButton {
            position: fixed;
            right: 12px;
            bottom: 76px;
            z-index: 40;
            border: 1px solid white;
            background: rgba(15,15,18,.8);
            color: white;
            padding: 10px 13px;
            border-radius: 7px;
        }

        #craftMenu {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: min(92vw, 430px);
            max-height: 80vh;
            overflow: auto;
            padding: 15px;
            background: rgba(12,15,19,.96);
            color: white;
            border: 2px solid rgba(255,255,255,.3);
            border-radius: 10px;
            z-index: 100;
            display: none;
        }

        #craftMenu h2 {
            margin-top: 0;
        }

        .recipe {
            border: 1px solid rgba(255,255,255,.2);
            margin: 7px 0;
            padding: 10px;
            border-radius: 7px;
        }

        .recipe button {
            margin-top: 7px;
            padding: 7px 10px;
        }

        #closeCraft {
            float: right;
        }

        #touchControls {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 35;
        }

        #joystick {
            position: absolute;
            left: 20px;
            bottom: 85px;
            width: 115px;
            height: 115px;
            border: 2px solid rgba(255,255,255,.25);
            border-radius: 50%;
            pointer-events: auto;
        }

        #stick {
            position: absolute;
            width: 48px;
            height: 48px;
            left: 31px;
            top: 31px;
            border-radius: 50%;
            background: rgba(255,255,255,.2);
        }

        #jump {
            position: absolute;
            right: 20px;
            bottom: 90px;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,.3);
            background: rgba(255,255,255,.12);
            color: white;
            pointer-events: auto;
        }

        @media (min-width: 800px) {
            #touchControls {
                display: none;
            }
        }
    </style>
</head>

<body>

<div id="game"></div>

<div id="hud">
    <div id="health">❤️ 100 / 100</div>
    <div id="oxygen">🫁 O₂ 100%</div>
</div>

<div id="preview"></div>

<div id="crosshair"></div>

<button id="craftButton">⚙ Chế tạo</button>

<div id="craftMenu">
    <button id="closeCraft">Đóng</button>
    <h2>Chế tạo</h2>
    <div id="recipes"></div>
</div>

<div id="hotbar"></div>

<div id="touchControls">
    <div id="joystick">
        <div id="stick"></div>
    </div>
    <button id="jump">↑</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script src="./texture.js"></script>
<script src="./loader.js"></script>
<script src="./world.js"></script>
<script src="./player.js"></script>
<script src="./mod.js"></script>
<script src="./game.js"></script>

</body>
</html>
